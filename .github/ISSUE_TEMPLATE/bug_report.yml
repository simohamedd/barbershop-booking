name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the page, what you clicked and any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: who
    attributes:
      label: Who was using it?
      options: [Customer (public site), Barber dashboard, Admin dashboard]
    validations:
      required: true
  - type: input
    id: ref
    attributes:
      label: Booking reference (if any)
      placeholder: BK-7KQ3MP
