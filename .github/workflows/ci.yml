name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch / PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/barbershop?sslmode=disable
  APP_URL: http://localhost:3000
  APP_SECRET: ci-only-secret-not-used-anywhere-else
  CRON_SECRET: ci-only-cron-secret
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Type check, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: barbershop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Booking engine tests (real Postgres)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Upload build for the e2e job
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: End-to-end browser tests
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: barbershop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - name: Prepare database with demo data
        run: |
          npm run db:migrate
          npm run db:seed -- --demo

      - name: Start the app
        run: |
          npm start > server.log 2>&1 &
          npx --yes wait-on@8 --timeout 60000 http://localhost:3000/api/health

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Server log
        if: failure()
        run: cat server.log

  docker:
    name: Docker image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Pull requests: build only (proves the Dockerfile works). Main: build and publish to ghcr.io.
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image against Postgres
        run: |
          docker network create smoke
          docker run -d --name db --network smoke -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=barbershop postgres:16-alpine
          docker build --target tools -t barbershop-tools .
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres && break; sleep 1; done
          docker run --rm --network smoke -e DATABASE_URL=postgres://postgres:postgres@db:5432/barbershop?sslmode=disable barbershop-tools
          docker build --target runner -t barbershop-app .
          docker run -d --name app --network smoke -p 3000:3000 \
            -e DATABASE_URL=postgres://postgres:postgres@db:5432/barbershop?sslmode=disable \
            -e APP_URL=http://localhost:3000 -e APP_SECRET=ci-only-secret-not-used-anywhere-else barbershop-app
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && exit 0; sleep 2; done
          docker logs app; exit 1
