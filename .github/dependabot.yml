version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for routine minor/patch bumps instead of one per package
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Next.js 16 and TypeScript 7 need code changes; upgrade deliberately
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
